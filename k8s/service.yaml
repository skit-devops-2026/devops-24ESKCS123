apiVersion: v1
kind: Service
metadata:
  name: trustlens-frontend
  labels:
    app.kubernetes.io/name: trustlens-frontend
    app.kubernetes.io/part-of: trustlens
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: trustlens-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: trustlens-backend
  labels:
    app.kubernetes.io/name: trustlens-backend
    app.kubernetes.io/part-of: trustlens
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trustlens-backend
  ports:
    - name: http
      port: 3000
      targetPort: http
